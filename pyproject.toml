[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serpbase-mcp"
version = "0.1.0"
description = "MCP server for the SerpBase Google Search, Images, News, Videos, and Maps APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SerpBase" }]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
serpbase-mcp = "serpbase_mcp.broker:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["serpbase_mcp"]
